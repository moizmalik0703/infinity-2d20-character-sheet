name: Live browser smoke tests — Infinity portfolio
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'data.js'
      - 'tests/**'
      - '.github/workflows/**'
permissions:
  contents: read
jobs:
  chromium-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PORTFOLIO_URL: https://moizmalik0703.github.io/infinity-2d20-character-sheet/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify public Pages matches checked-out release
        run: node tests/wait-for-pages.cjs
      - name: Install Playwright runner and Chromium
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - name: Execute real browser interactions against published GitHub Pages
        run: npx playwright test tests/e2e/ --reporter=line --workers=1
      - name: Approved house-rule browser smoke test against public Pages
        env:
          SHEET_URL: https://moizmalik0703.github.io/infinity-2d20-character-sheet/
        run: node tests/v81-browser-smoke.cjs
      - name: Upload browser diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-browser-diagnostics
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
